name: Cloudflare Pages dashboard update

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: "Run even if today is not the first trading day"
        required: false
        default: "true"
      end_date:
        description: "Optional backtest end date, YYYY-MM-DD"
        required: false
        default: ""
  schedule:
    # Runs after the regular US market close on weekdays. The job itself exits
    # unless the date is the first trading day of the month.
    - cron: "30 22 * * 1-5"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Nasdaq strategy repo
        uses: actions/checkout@v6
        with:
          repository: cozec/momentum_6month_claude
          path: nasdaq_repo
          token: ${{ secrets.NASDAQ_REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r nasdaq_repo/nasdaq100_momentum_backtest/requirements.txt

      - name: Decide whether to run
        id: trading_day
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_update }}" = "true" ]; then
            FORCE="--force"
          fi
          python scripts/is_first_trading_day.py $FORCE

      - name: Build historical membership
        if: steps.trading_day.outputs.should_run == 'true'
        run: python scripts/build_wikipedia_sp500_membership.py --output data/sp500_membership.csv

      - name: Run Nasdaq overlap source backtest
        if: steps.trading_day.outputs.should_run == 'true'
        working-directory: nasdaq_repo/nasdaq100_momentum_backtest
        run: |
          if [ -n "${{ inputs.end_date }}" ]; then
            END_DATE="${{ inputs.end_date }}"
          else
            END_DATE="$(TZ=America/New_York date +%F)"
          fi
          python - <<PY
          import os
          import sys
          from pathlib import Path

          import pandas as pd

          sys.path.insert(0, os.getcwd())

          from src.backtest import run_backtest
          from src.config import BacktestConfig, OUTPUTS_DIR
          from src.metrics import calculate_summary_stats

          config = BacktestConfig(
              start_date="2016-01-01",
              end_date="${END_DATE}",
              top_n=3,
              lookback_months=6,
              benchmark="QQQ",
              secondary_benchmark="TQQQ",
              score_method="average_monthly_return",
              transaction_cost_bps=0.0,
              slippage_bps=0.0,
              initial_capital=100_000.0,
              use_historical_membership=True,
          )
          results = run_backtest(config)
          output_dir = Path(OUTPUTS_DIR)
          output_dir.mkdir(parents=True, exist_ok=True)
          results["selections"].to_csv(output_dir / "monthly_selections.csv", index=False)
          results["portfolio_returns"].to_csv(output_dir / "portfolio_returns.csv", index=False)
          calculate_summary_stats(results["portfolio_returns"]).to_csv(output_dir / "summary_stats.csv")
          open_position = results.get("open_position", pd.DataFrame())
          open_position.to_csv(output_dir / "open_rebalance_picks.csv", index=False)
          PY

      - name: Run backtest
        if: steps.trading_day.outputs.should_run == 'true'
        run: |
          if [ -n "${{ inputs.end_date }}" ]; then
            END_DATE="${{ inputs.end_date }}"
          else
            END_DATE="$(TZ=America/New_York date +%F)"
          fi
          python main.py \
            --start-date 2016-01-01 \
            --end-date "$END_DATE" \
            --membership-mode historical_constituents \
            --refresh-data

      - name: Export static dashboard
        if: steps.trading_day.outputs.should_run == 'true'
        env:
          NASDAQ_SELECTIONS_PATH: ${{ github.workspace }}/nasdaq_repo/nasdaq100_momentum_backtest/outputs/monthly_selections.csv
          NASDAQ_OPEN_PATH: ${{ github.workspace }}/nasdaq_repo/nasdaq100_momentum_backtest/outputs/open_rebalance_picks.csv
        run: python scripts/export_static_dashboard.py --output-dir public

      - name: Deploy to Cloudflare Pages
        if: steps.trading_day.outputs.should_run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
